      uid: "{{ slurm_uid }}"
      system: true
      no_create_home: true
      shell: /sbin/nologin
  write_files:
    - path: /etc/hosts
      append: true
      content: "{{ ip_name_map | dictsort | map('reverse') | map('join', ' ') | join('\n') }}"
  runcmd:
    - mkdir -pv /cert
    - echo "{{ cloud_init_nfs_path }}/cert /cert nfs defaults,_netdev 0 0" >> /etc/fstab
