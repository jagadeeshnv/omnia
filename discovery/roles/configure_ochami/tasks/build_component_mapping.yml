- name: Add XNAMEs to component mapping
  ansible.builtin.set_fact:
    component_to_xnames: >-
      {{
        component_to_xnames | default({})
        | combine({
          component: (component_to_xnames[component] | default([])) + (functional_group_to_xnames[functional_group] | default([]))
        })
      }}
  loop: "{{ functional_group_cloud_init_components[functional_group] }}"
  loop_control:
    loop_var: component
